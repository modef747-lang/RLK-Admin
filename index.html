<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RLK Reader - Admin Upload Panel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between">

    <!-- Header Section -->
    <header class="bg-white border-b border-slate-200 py-4 px-6 shadow-sm">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                📚 RLK Reader 
                <span class="text-xs bg-indigo-100 text-indigo-700 px-2.5 py-0.5 rounded-full font-medium">Admin Panel</span>
            </h1>
            <span class="text-xs font-medium text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full border border-emerald-200">● Cloud Connected</span>
        </div>
    </header>

    <!-- Main Upload Card -->
    <main class="flex-grow flex items-center justify-center p-4 py-8">
        <div class="bg-white w-full max-w-xl rounded-2xl shadow-xl border border-slate-100 p-8 transition-all">
            
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-slate-900">Upload New Book</h2>
                <p class="text-sm text-slate-500 mt-1">Add book details to sync instantly with your mobile app.</p>
            </div>

            <!-- Upload Form -->
            <form id="uploadForm" class="space-y-4">
                
                <!-- Book Title -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Book Title / Name</label>
                    <input type="text" id="bookTitle" required placeholder="e.g. Advanced Flutter Guide" 
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-800 placeholder-slate-400 text-sm transition">
                </div>

                <!-- Author Name -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Author Name</label>
                    <input type="text" id="authorName" required placeholder="e.g. John Doe" 
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-800 placeholder-slate-400 text-sm transition">
                </div>

                <!-- Grid for Language & Format -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Language Selection -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Language</label>
                        <select id="language" required 
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-800 bg-white text-sm transition">
                            <option value="English">English</option>
                            <option value="Urdu">Urdu (اردو)</option>
                        </select>
                    </div>

                    <!-- Format Selection -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Format</label>
                        <select id="format" required 
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-800 bg-white text-sm transition">
                            <option value="PDF">PDF</option>
                            <option value="EPUB">EPUB</option>
                        </select>
                    </div>
                </div>

                <!-- Cover Image URL -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Cover Image URL (`coverUrl`)</label>
                    <input type="url" id="coverUrl" required placeholder="Paste image link here" 
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-800 placeholder-slate-400 text-sm transition">
                </div>

                <!-- PDF / File URL -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">PDF / File URL (`pdfUrl`)</label>
                    <input type="url" id="pdfUrl" required placeholder="Paste book file link here" 
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-800 placeholder-slate-400 text-sm transition">
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" 
                    class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-semibold py-3 px-4 rounded-xl shadow-md hover:shadow-lg transition duration-200 flex items-center justify-center gap-2">
                    <span>Upload Book to Database</span>
                </button>
            </form>

            <!-- Status / Success Message Box -->
            <div id="statusMessage" class="mt-4 text-center text-sm font-medium hidden p-3 rounded-xl"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-slate-400">
        RLK Reader Admin &bull; Powered by Firebase & Vercel
    </footer>

    <!-- Firebase SDK & Upload Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Apne asal Firebase credentials yahan dalein
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('bookTitle').value;
            const author = document.getElementById('authorName').value;
            const language = document.getElementById('language').value;
            const format = document.getElementById('format').value;
            const coverUrl = document.getElementById('coverUrl').value;
            const pdfUrl = document.getElementById('pdfUrl').value;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Uploading to Cloud...</span>';
            statusMessage.classList.add('hidden');

            try {
                // Timeout check taake request hang na ho
                const timeoutPromise = new Promise((_, reject) => 
                    setTimeout(() => reject(new Error("Connection timeout! Check your Firebase config or internet connection.")), 10000)
                );

                const uploadPromise = addDoc(collection(db, "books"), {
                    title: title,
                    author: author,
                    language: language,
                    format: format,
                    coverUrl: coverUrl,
                    pdfUrl: pdfUrl,
                    createdAt: serverTimestamp()
                });

                await Promise.race([uploadPromise, timeoutPromise]);

                statusMessage.textContent = "Book uploaded successfully! Now check your mobile app.";
                statusMessage.className = "mt-4 text-center text-sm font-medium p-3 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-200";
                statusMessage.classList.remove('hidden');
                form.reset();
            } catch (error) {
                console.error("Error adding document: ", error);
                statusMessage.textContent = "Error: " + error.message;
                statusMessage.className = "mt-4 text-center text-sm font-medium p-3 rounded-xl bg-red-50 text-red-700 border border-red-200";
                statusMessage.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Upload Book to Database</span>';
            }
        });
    </script>
</body>
</html>
