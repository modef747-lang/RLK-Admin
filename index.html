<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RLK Admin Panel</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; }
    .container { max-width: 500px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin: auto; }
    h2 { text-align: center; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; }
    button { background: #4CAF50; color: white; padding: 10px; border: none; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; }
    button:hover { background: #45a049; }
    #status { margin-top: 15px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h2>RLK Admin - Book Upload</h2>
    <form id="uploadForm">
      <div class="form-group">
        <label>Book Title:</label>
        <input type="text" id="title" required>
      </div>
      <div class="form-group">
        <label>Author:</label>
        <input type="text" id="author" required>
      </div>
      <div class="form-group">
        <label>Cover Image URL:</label>
        <input type="text" id="coverUrlInput" placeholder="Yahan cover image ka link paste karein" required>
      </div>
      <div class="form-group">
        <label>Book File URL (PDF / EPUB):</label>
        <input type="text" id="bookUrlInput" placeholder="Yahan book file ka link paste karein" required>
      </div>
      <button type="submit">Save Book to Database</button>
    </form>
    <div id="status"></div>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
