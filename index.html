<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RLK Reader - Admin Upload Panel</title>
    <!-- Tailwind CSS CDN for Modern Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between">

    <!-- Header Section -->
    <header class="bg-white border-b border-slate-200 py-4 px-6 shadow-sm">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                📚 RLK Reader 
                <span class="text-xs bg-indigo-100 text-indigo-700 px-2.5 py-0.5 rounded-full font-medium">Admin Panel</span>
            </h1>
            <span class="text-xs font-medium text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full border border-emerald-200">● Cloud Connected</span>
        </div>
    </header>

    <!-- Main Upload Card -->
    <main class="flex-grow flex items-center justify-center p-4 py-8">
        <div class="bg-white w-full max-w-xl rounded-2xl shadow-xl border border-slate-100 p-8 transition-all">
            
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-slate-900">Upload New Book</h2>
                <p class="text-sm text-slate-500 mt-1">Add book details to sync instantly with your mobile app.</p>
            </div>

            <!-- Upload Form -->
            <form id="uploadForm" class="space-y-4">
                
                <!-- Book Title -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Book Title / Name</label>
                    <input type="text" id="bookTitle" required placeholder="e.g. Advanced Flutter Guide" 
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-800 placeholder-slate-400 text-sm transition">
                </div>

                <!-- Author Name -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Author Name</label>
                    <input type="text" id="authorName" required placeholder="e.g. John Doe" 
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-800 placeholder-slate-400 text-sm transition">
                </div>

                <!-- Grid for Language & Format -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Language Selection (English & Urdu only) -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Language</label>
                        <select id="language" required 
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-800 bg-white text-sm transition">
                            <option value="English">English</option>
                            <option value="Urdu">Urdu (اردو)</option>
                        </select>
                    </div>

                    <!-- Format Selection -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Format</label>
                        <select id="format" required 
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-800 bg-white text-sm transition">
                            <option value="PDF">PDF</option>
                            <option value="EPUB">EPUB</option>
                        </select>
                    </div>
                </div>

                <!-- Cover Image URL -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Cover Image URL (`coverUrl`)</label>
                    <input type="url" id="coverUrl" required placeholder="Paste image link here" 
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-800 placeholder-slate-400 text-sm transition">
                </div>

                <!-- PDF / File URL -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">PDF / File URL (`pdfUrl`)</label>
                    <input type="url" id="pdfUrl" required placeholder="Paste book file link here" 
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-800 placeholder-slate-400 text-sm transition">
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" 
                    class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-semibold py-3 px-4 rounded-xl shadow-md hover:shadow-lg transition duration-200 flex items-center justify-center gap-2">
                    <span>Upload Book to Database</span>
                </button>
            </form>

            <!-- Status / Success Message Box -->
            <div id="statusMessage" class="mt-4 text-center text-sm font-medium hidden p-3 rounded-xl"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-slate-400">
        RLK Reader Admin &bull; Powered by Firebase & Vercel
    </footer>

    <!-- Firebase & Custom Script -->
    <script>
        // Yahan aap apna Firebase initialization aur form submit wala code lagayenge
        // jo Firestore database mein in saare fields ko save karega.
    </script>
</body>
</html>
